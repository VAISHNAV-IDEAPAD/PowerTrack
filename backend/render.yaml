services:
  - type: web
    name: powertrack-cloud
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: ./data/powertrack.sqlite
      - key: LOCATION_RETENTION_DAYS
        value: 90
